version: "3.8"
services:
  db:
    image: postgres:15
    container_name: ravenplanner_postgres
    restart: always
    environment:
      POSTGRES_USER: ravenuser
      POSTGRES_PASSWORD: ravenpass
      POSTGRES_DB: ravendb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: