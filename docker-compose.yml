services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ravenplanner
      POSTGRES_USER: raven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raven}
    volumes:
      - raven-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven -d ravenplanner"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build: .
    environment:
      DATABASE_URL: postgresql://raven:${POSTGRES_PASSWORD:-raven}@db:5432/ravenplanner
      ACTIVE_TERM: ${ACTIVE_TERM:-FALL}
      ACTIVE_YEAR: ${ACTIVE_YEAR:-2026}
      RAVEN_ADVISOR_ENABLED: ${RAVEN_ADVISOR_ENABLED:-false}
      RAVEN_ADVISOR_MODEL_PATH: /models/${RAVEN_ADVISOR_MODEL_FILE:-smol.gguf}
      RAVEN_ADVISOR_THREADS: ${RAVEN_ADVISOR_THREADS:-1}
      RAVEN_ADVISOR_QUEUE_SIZE: ${RAVEN_ADVISOR_QUEUE_SIZE:-4}
      RAVEN_ADVISOR_TIMEOUT_MS: ${RAVEN_ADVISOR_TIMEOUT_MS:-180000}
    volumes:
      - ${RAVEN_ADVISOR_MODEL_DIR:-./.local/models}:/models:ro
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  raven-data:
