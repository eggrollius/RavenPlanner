services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ravenplanner
      POSTGRES_USER: raven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raven}
    volumes:
      - raven-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven -d ravenplanner"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build: .
    environment:
      DATABASE_URL: postgresql://raven:${POSTGRES_PASSWORD:-raven}@db:5432/ravenplanner
      ACTIVE_TERM: ${ACTIVE_TERM:-SUMMER}
      ACTIVE_YEAR: ${ACTIVE_YEAR:-2025}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  raven-data:
